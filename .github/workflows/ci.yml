# CI: thin caller over the family's reusable workflow in sigrun-ai/sigrun
# (release workstream Task 2.2) — the jobs live there so they cannot
# drift across the 10 repos. needs-core: true (file:-linked dev
# deps; core and the family siblings are checked out beside this repo
# first).
# core-ref: main while the 0.20.0 train bootstraps (the source needs
# shared helpers that only exist in core 0.20.0, unpublished at tagging
# time); flip back to release once core 0.20.0 is on the registry.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    uses: sigrun-ai/sigrun/.github/workflows/ext-ci.yml@main
    with:
      needs-core: true
      core-ref: main
